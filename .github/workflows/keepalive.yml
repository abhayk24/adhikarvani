name: Keep the live app awake

# Render's free web services sleep after 15 minutes without traffic. A light ping
# every 10 minutes keeps the demo instant for judges (one service fits the free
# 750 hours a month). Disable this workflow after judging if you like.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: deploy
      - name: Ping
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          URL="${APP_URL:-$(cat deploy/app_url.txt)}"
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 120 "$URL/healthz" || true)
          echo "$URL/healthz -> $code"
